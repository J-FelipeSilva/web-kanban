<!DOCTYPE html> <!--indica que formato do documento é HTML5-->
<html lang="pt-BR"> <!--o atributo lang define o idioma do documento como português do Brasil-->
	<head>
		<meta charset="UTF-8"> <!--garante que o navegador interprete corretamente os caracteres especiais do documento-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--garante que o layout seja responsivo-->
		<title>Web Kanban</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	</head>

	<body>
		<header>
			<span>Quadro Kanban</span>
		</header>
		
		<div class="layout-principal"> <!--é o container principal-->
			<div id ="menu-vertical" class="menu-vertical"> <!--é o container onde ficará a integração com AI, separar os sprints no futuro-->
				<button type="button" class="add-fluxo-de-trabalho" onclick="criarFluxoDeTrabalho()">+ Adicionar Fluxo de Trabalho</button>
			</div>
			
			<div id="quadro" class="quadro"> <!--é o container de cada fluxo de trabalho no quadro Kanban-->
				<div id="coluna-1" class="fluxo-de-trabalho">
					<div class="header">
						<button type="button" class="editar-fluxo-de-trabalho" onclick="editarFluxoDeTrabalho(this)"><i class="material-icons">menu</i></button>
						<span>A Fazer</span>
						<span class="contador"></span>
					</div>

					<div class="caixa-de-tarefas" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"> <!--é o container das tarefas em forma de post-it-->
						<!--as tarefas ficam aqui-->
						<div id="tarefa-4" class="tarefa" draggable="true" ondragstart="dragstartHandler(event)">
							<button type="button" class="excluir-tarefa" onclick="excluirTarefa(this)"><i class="material-icons">close</i></button>	
							<span>Integração com DB e AI</span>
						</div>
					</div>
					<button type="button" class="add-tarefa" onclick="criarTarefa(this)">+ Adicionar Tarefa</button>
				</div>

				<div id="coluna-2" class="fluxo-de-trabalho">
					<div class="header">
						<button type="button" class="editar-fluxo-de-trabalho" onclick="editarFluxoDeTrabalho(this)"><i class="material-icons">menu</i></button>
						<span>Em Andamento</span>
						<span class="contador"></span>
					</div>

					<div class="caixa-de-tarefas" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"> <!--é o container das tarefas em forma de post-it-->
						<!--as tarefas ficam aqui-->
						<div id="tarefa-1" class="tarefa" draggable="true" ondragstart="dragstartHandler(event)">
							<button type="button" class="excluir-tarefa" onclick="excluirTarefa(this)"><i class="material-icons">close</i></button>
							<span>HTML & CSS</span>
						</div>
						<div id="tarefa-2" class="tarefa" draggable="true" ondragstart="dragstartHandler(event)">
							<button type="button" class="excluir-tarefa" onclick="excluirTarefa(this)"><i class="material-icons">close</i></button>
							<span>javaScript</span>
						</div>
					</div>
					<button type="button" class="add-tarefa" onclick="criarTarefa(this)">+ Adicionar Tarefa</button>
				</div>

				<div id="coluna-3" class="fluxo-de-trabalho">
					<div class="header">
						<button type="button" class="editar-fluxo-de-trabalho" onclick="editarFluxoDeTrabalho(this)"><i class="material-icons">menu</i></button>
						<span>Concluído</span>
						<span class="contador"></span>
					</div>

					<div class="caixa-de-tarefas" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"> <!--é o container das tarefas em forma de post-it-->
						<!--as tarefas ficam aqui-->
						<div id="tarefa-3" class="tarefa" draggable="true" ondragstart="dragstartHandler(event)">
							<button type="button" class="excluir-tarefa" onclick="excluirTarefa(this)"><i class="material-icons">close</i></button>	
							<span>webStorageAPI</span>
						</div>
					</div>
					<button type="button" class="add-tarefa" onclick="criarTarefa(this)">+ Adicionar Tarefa</button>
				</div>
			</div>
		</div>

		<dialog id="janela-editar-fluxo-de-trabalho">
			<div class="janela-header">
				<span>Editar Fluxo de Trabalho</span>
				<button type="button" class="cancelar" onclick="cancelar()"><i class="material-icons">close</i></button>
			</div>
			<div class="janela-body">
				<label for="input"></label>
				<input type="text" id="input"></input>
			</div>
			<div class="janela-footer">
				<button type="button" class="excluir-fluxo-de-trabalho" onclick="excluirFluxoDeTrabalho(this)">excluir</button>
				<button type="button" class="salvar-fluxo-de-trabalho" onclick="salvarFluxoDeTrabalho(this)">salvar</button>
			</div>
		</dialog>
		<script type="text/javascript" src="script.js"></script>
	</body>
</html>
